name: W527 factory98 injectable modules (bfq+bbr)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout this repo (factory98.config)
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev make gcc

      - name: Install aarch64 cross toolchain (GCC 11)
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu
          aarch64-linux-gnu-gcc --version | head -1

      - name: Clone vendor tree (ZeroDreamCat uws6152 4.14.98)
        run: |
          git clone --depth=1 --branch test --recurse-submodules \
            https://github.com/ZeroDreamCat/android_uws6152_4.14.98.git source
          cd source
          git submodule update --init --recursive || true

      - name: Configure with factory-exact config + BFQ/BBR as modules
        run: |
          cd source
          sed -i 's/^EXTRAVERSION =.*/EXTRAVERSION =/' Makefile
          cp ../factory98.config .config
          grep -q '^CONFIG_TCP_CONG_ADVANCED=y' .config || printf 'CONFIG_TCP_CONG_ADVANCED=y\n' >> .config
          grep -q '^CONFIG_TCP_CONG_BBR=m' .config || printf 'CONFIG_TCP_CONG_BBR=m\n' >> .config
          sed -i '/yamltree\.o/d' scripts/dtc/Makefile
          sed -i 's/dt_to_yaml(/\/\/ dt_to_yaml(/g' scripts/dtc/dtc.c
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          make olddefconfig
          echo "=== final config check ==="
          grep -E "IOSCHED_BFQ|TCP_CONG_BBR|MODVERSIONS|MODULE_SIG" .config
          echo "=== kernelrelease ==="
          make -s kernelrelease 2>/dev/null | grep -v '^#' | tail -1

      - name: Build modules
        run: |
          cd source
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          set -o pipefail
          make -j$(nproc) KCFLAGS="-Wno-error=missing-attributes" block/bfq.ko net/ipv4/tcp_bbr.ko 2>&1 | tee build.log || {
            echo "=== BUILD FAILED ==="
            grep -nE "error:|Error [0-9]" build.log | head -30
            exit 1
          }
          echo "=== module outputs ==="
          ls -la block/bfq.ko net/ipv4/tcp_bbr.ko
          echo "=== vermagic ==="
          modinfo block/bfq.ko | grep -E "vermagic|name|version"
          modinfo net/ipv4/tcp_bbr.ko | grep vermagic

      - name: Upload module artifacts
        uses: actions/upload-artifact@v4
        with:
          name: w527-inject-modules
          path: |
            source/block/bfq.ko
            source/net/ipv4/tcp_bbr.ko
            source/build.log
          if-no-files-found: error
