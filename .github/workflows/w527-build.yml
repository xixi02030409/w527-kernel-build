name: W527 kernel stage build (parameterized)

# Stage 1 of 内核重建 (see w527_文档/内核重建_基座总账与计划_20261115.md)
# 基座 = ZDC uws6152 4.14.98, branch r56v2 (3e4e0d143)
# config = w527_s1.config = w527_r56_v1.config 原样, 仅 4 个自研驱动改 n
# 目的 = 得到"只有基座"的最小起机基线; 验收 boot_completed / /data / lsmod 14 ko

on:
  workflow_dispatch:
    inputs:
      config:
        description: 'config file in this repo (e.g. w527_s2t.config)'
        required: true
        default: 'w527_s1.config'
      tag:
        description: 'release tag suffix'
        required: true
        default: 's1'
      require_config:
        description: 'grep -q pattern that MUST exist in final .config (empty = skip)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout config carrier
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install host deps and aarch64 toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bc bison flex libssl-dev make gcc libyaml-dev cpio xz-utils gcc-aarch64-linux-gnu
          aarch64-linux-gnu-gcc --version | head -1

      - name: Clone base tree (ZDC uws6152 4.14.98, branch r56v2)
        run: |
          git clone --depth=1 --branch w527-rebuild-1115 \
            https://github.com/xixi02030409/android_uws6152_4.14.98.git source
          cd source
          git log --oneline -1

      - name: Pre-flight identity gates
        run: |
          cd source
          sed -i 's/^EXTRAVERSION =.*/EXTRAVERSION =/' Makefile
          echo "=== version lines ==="
          grep -E "^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)" Makefile
          grep -q "^SUBLEVEL = 98$" Makefile || { echo "AUDIT FAIL: SUBLEVEL != 98"; exit 1; }
          grep -q 'MODULE_VERMAGIC_MODVERSIONS "modversions "' include/linux/vermagic.h || { echo "AUDIT FAIL: vermagic tag missing"; exit 1; }
          echo "vermagic tag: OK"
          grep -q "Accept inlinecrypt" fs/f2fs/super.c || { echo "AUDIT FAIL: inlinecrypt shim missing"; exit 1; }
          echo "f2fs inlinecrypt shim: OK"
          test ! -e drivers/kernelsu || { echo "AUDIT FAIL: kernelsu present"; exit 1; }
          echo "kernelsu: absent OK"
          grep -q "get_bus_status" include/misc/wcn_bus.h && echo "note: get_bus_status reference present (comment only?)" || true
          grep -q "W527 ABI fix: get_bus_status member REMOVED" include/misc/wcn_bus.h || { echo "AUDIT FAIL: wcn_bus ABI fix missing"; exit 1; }
          echo "wcn_bus ABI fix: OK"
          if grep -q "end_cac" net/wireless/rdev-ops.h; then echo "AUDIT FAIL: dead rdev_end_cac stub still present"; exit 1; fi
          echo "dead rdev_end_cac stub: removed OK"
          if grep -q "is_amsdu" include/net/cfg80211.h; then echo "AUDIT FAIL: half-applied exthdr signature backport"; exit 1; fi
          echo "half-applied exthdr backport: reverted OK"

      - name: Apply S1 config (4 self-drivers off)
        run: |
          cd source
          cp ../${{ inputs.config }} .config
          sed -i '/yamltree\.o/d' scripts/dtc/Makefile
          sed -i 's/dt_to_yaml(/\/\/ dt_to_yaml(/g' scripts/dtc/dtc.c
          sed -i '/ifdef CONFIG_CC_STACKPROTECTOR_STRONG/{n;s/stackp-flag :=.*/stackp-flag := -fstack-protector-strong/}' Makefile
          sed -i '/ifdef stackp-name/,/endif/{s/exit 1/true/}' Makefile
          sed -i '/ifdef stackp-check/,/endif/{s/exit 1/true/}' Makefile
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          make olddefconfig
          echo "=== must be n (Stage 1 turns them off) ==="
          for s in TOUCHSCREEN_HYNITRON_TS SENSORS_QMC6308 SENSORS_MIR3DA CHARGER_ETA6947; do
            if grep -q "^CONFIG_$s=" .config; then echo "AUDIT FAIL: $s still enabled"; exit 1; fi
            echo "  $s : off OK"
          done
          echo "=== must be y (baseline survival kit) ==="
          grep -E "^CONFIG_(F2FS_FS|FS_ENCRYPTION|WCN_WLAN|FUEL_GAUGE_SC27XX)=" .config
          echo "=== MODVERSIONS must be n ==="
          grep -q "^# CONFIG_MODVERSIONS is not set" .config || { echo "AUDIT FAIL: MODVERSIONS not disabled"; exit 1; }
          if [ -n "${{ inputs.require_config }}" ]; then
            grep -q "${{ inputs.require_config }}" .config || { echo "AUDIT FAIL: required config '${{ inputs.require_config }}' missing"; exit 1; }
            echo "required config OK: ${{ inputs.require_config }}"
          fi
          cp .config ../final_config_${{ inputs.tag }}.txt

      - name: Build Image
        run: |
          cd source
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          KCFLAGS="-Wno-error=sizeof-pointer-memaccess -Wno-error=array-bounds -Wno-error=missing-braces -Wno-error=format -Wno-error=missing-attributes -Wno-error=address-of-packed-member -Wno-address-of-packed-member -Wno-error=zero-length-bounds -fno-tree-loop-distribute-patterns -fno-store-merging -fno-tree-slp-vectorize"
          set -o pipefail
          make -j$(nproc) Image KCFLAGS="$KCFLAGS" 2>&1 | tee build.log
          ls -l arch/arm64/boot/Image

      - name: Post-build audit gates
        run: |
          cd source
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          KR=$(make -s kernelrelease 2>/dev/null | grep -v '^#' | tail -1)
          echo "kernelrelease = $KR"
          test "$KR" = "4.14.98" || { echo "AUDIT FAIL: kernelrelease is $KR"; exit 1; }
          python3 - <<'PY'
          import re, struct, sys
          d = open('arch/arm64/boot/Image','rb').read()
          print("Image size:", len(d))
          br = struct.unpack('<I', d[:4])[0] >> 24
          print("arm64 branch opcode:", hex(br))
          assert br == 0x14, "not an arm64 Image"
          assert len(d) <= 17568128, "Image too large for boot partition"
          hits = []
          for m in re.finditer(rb'4\.14\.98[^\x00]{0,80}', d):
              t = m.group(0).decode('latin1', 'replace')
              if t not in hits:
                  hits.append(t)
          print("=== strings containing 4.14.98 (max 8) ===")
          for t in hits[:8]:
              print("  HIT:", t[:100])
          # 注意：ZDC 树 kernel/module.c 的 load_module() 无条件置位
          # MODULE_INIT_IGNORE_MODVERSIONS / MODULE_INIT_IGNORE_VERMAGIC，
          # 于是 vermagic[] 无引用被编译器丢弃 -> Image 里没有 vermagic 字符串是【预期行为】。
          # 本树不能用 "Image 含 vermagic" 做判据；改判 source 层行为 + 三条硬指标。
          want = b"4.14.98 SMP preempt mod_unload modversions aarch64"
          if want not in d:
              print("AUDIT FAIL: exact vermagic string absent from Image")
              sys.exit(1)
          print("VERMAGIC PRESENT:", want.decode())
          PY
          if grep -q "flags |= MODULE_INIT_IGNORE_VERMAGIC" kernel/module.c; then echo "AUDIT FAIL: ZDC force-load bypass still present"; exit 1; fi
          if grep -q "flags |= MODULE_INIT_IGNORE_MODVERSIONS" kernel/module.c; then echo "AUDIT FAIL: ZDC force-load bypass still present"; exit 1; fi
          echo "vermagic enforcement: ACTIVE (bypass removed) OK"
          ls -l System.map
          ls -l System.map

      - name: Upload build log and config (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ inputs.tag }}
          path: |
            source/build.log
            source/include/config/kernel.release
            source/arch/arm64/boot/Image
            source/System.map
            final_config_${{ inputs.tag }}.txt
          if-no-files-found: ignore

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ inputs.tag }}-${{ github.run_id }}
          name: W527 ${{ inputs.tag }} ${{ github.run_id }}
          files: |
            source/arch/arm64/boot/Image
            source/System.map
            source/build.log
            final_config_${{ inputs.tag }}.txt
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
