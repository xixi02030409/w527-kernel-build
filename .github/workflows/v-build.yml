name: V-line build (mainline unisoc, dual track)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'v-max = v7.2-rc6-ums9230-0 (codeberg) or v-lts = v6.12 tag'
        required: true
        default: 'v-max'
      config_name:
        description: 'config file under configs/ of this repo'
        required: true
        default: 'ums9230-pmos.config'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Pick tree ref
        id: ref
        run: |
          if [ "${{ inputs.variant }}" = "v-lts" ]; then
            echo "repo=https://github.com/sprd-linux/ums9230-mainline-linux.git" >> $GITHUB_OUTPUT
            echo "ref=v6.12" >> $GITHUB_OUTPUT
          else
            echo "repo=https://codeberg.org/ums9230-mainline/linux.git" >> $GITHUB_OUTPUT
            echo "ref=v7.2-rc6-ums9230-0" >> $GITHUB_OUTPUT
          fi

      - name: Clone unisoc mainline tree
        run: |
          git clone --depth 1 --branch ${{ steps.ref.outputs.ref }} ${{ steps.ref.outputs.repo }} src
          cd src && git log --oneline -3 && head -5 Makefile

      - name: Fetch config
        run: |
          curl -sL "https://raw.githubusercontent.com/xixi02030409/w527-kernel-build/main/configs/${{ inputs.config_name }}" -o src/k.config
          head -3 src/k.config

      - name: Install clang toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev cpio xz-utils \
            clang llvm lld pahole zstd
          clang --version | head -1

      - name: Configure via olddefconfig
        run: |
          cd src
          cp k.config .config
          make ARCH=arm64 LLVM=1 olddefconfig
          echo "=== survived critical options ==="
          grep -E "ARCH_SPRD|SERIAL_SPRD|MMC_BLOCK=|MFD_SC27XX|REGULATOR_SC2730|ARM_CPUIDLE|F2FS_FS=|EXT4_FS=|DEVTMPFS_MOUNT" .config || true
          echo "=== compression/size switches ==="
          grep -E "CONFIG_KERNEL_GZIP|CONFIG_KERNEL_ZSTD|CONFIG_EFI_ZBOOT|CONFIG_DEBUG_INFO" .config || true

      - name: Build Image and dtbs
        run: |
          cd src
          set -o pipefail
          make ARCH=arm64 LLVM=1 -j$(nproc) Image dtbs 2>&1 | tee build.log
          ls -l arch/arm64/boot/Image

      - name: Upload artifacts before audit
        uses: actions/upload-artifact@v4
        with:
          name: vline-${{ inputs.variant }}
          path: |
            src/arch/arm64/boot/Image
            src/.config
            src/build.log
          if-no-files-found: warn

      - name: Post-build audit version-proof magic check
        run: |
          cd src
          python3 - << 'PY'
          import struct
          d = open('arch/arm64/boot/Image','rb').read()
          print("Image size:", len(d))
          print("first16:", d[:16].hex())
          magic = d[0x38:0x3c]
          print("magic at 0x38:", magic)
          assert magic == b'ARM\x64', "bad arm64 Image magic"
          w0 = struct.unpack('<I', d[:4])[0] >> 24
          print("word0 opcode:", hex(w0), "(0x14 classic branch, 0xfa modern MZ ccmp)")
          print("OK: valid arm64 Image")
          PY

      - name: Release to GitHub releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: vline-${{ inputs.variant }}-${{ github.run_id }}
          files: |
            src/arch/arm64/boot/Image
            src/build.log
