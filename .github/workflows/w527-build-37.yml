name: W527 kernel r37 (factory-replica, xintaiqi tree)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout this repo (workflow + configs + overlays)
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev make gcc libyaml-dev cpio xz-utils

      - name: Clone xintaiqi uws6152 tree (factory-sibling BSP, 4.14.98)
        run: |
          git clone --depth=1 --branch android-9.0 \
            https://github.com/atlas4381/android_kernel_xintaiqi_uws6152_1h10_test.git source
          cd source
          echo "=== Makefile version ==="
          grep -E "^(VERSION|PATCHLEVEL|SUBLEVEL)" Makefile

      - name: Install aarch64 cross toolchain (GCC 11)
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu
          aarch64-linux-gnu-gcc --version | head -1

      - name: Overlay fscrypt v2 backport (A11 vold requires v2 API)
        run: |
          tar -xzf overlay_fscrypt_v2.tar.gz -C source
          cd source
          rm -f include/linux/fscrypt_notsupp.h include/linux/fscrypt_supp.h
          echo "=== fs/crypto files ==="; ls fs/crypto/ | head -5

      - name: Fix fs.h s_master_keys and xts.c builtin clash (gcc11 vs stock 4.14)
        run: |
          cd source
          python3 << 'PYEOF'
          import sys
          p = 'include/linux/fs.h'
          s = open(p).read()
          if 's_master_keys' in s:
              print('fs.h already has s_master_keys')
          else:
              anchor = 'struct super_block {'
              n = s.count(anchor)
              if n != 1:
                  print('fs.h anchor matched %d times, abort' % n); sys.exit(1)
              ins = anchor + ('\n\t/* fscrypt v2 backport: master key ring '
                              '(fs/crypto/keyring.c) */\n\tvoid\t\t*s_master_keys;')
              open(p, 'w').write(s.replace(anchor, ins))
              print('fs.h patched: s_master_keys added')
          x = 'crypto/xts.c'
          s = open(x).read()
          import re
          s2 = re.sub(r'\bstatic void free\(', 'static void xts_free(', s)
          s2 = re.sub(r'((?:\.|->)free\s*=\s*)free\b', r'\1xts_free', s2)
          if s2 != s:
              open(x, 'w').write(s2)
              print('xts.c renamed free -> xts_free')
          else:
              print('xts.c no clash pattern, left as is')
          # sprd_dfs_trace.h: android-9.0 branch has TRACE_INCLUDE_PATH=. (gcc11 cannot
          # resolve ./ relative to -I$(srctree)); test branch fixed it to drivers/devfreq/sprd
          t = 'drivers/devfreq/sprd/sprd_dfs_trace.h'
          s = open(t).read()
          s2 = s.replace('#define TRACE_INCLUDE_PATH .',
                         '#define TRACE_INCLUDE_PATH drivers/devfreq/sprd')
          if s2 != s:
              open(t, 'w').write(s2)
              print('sprd_dfs_trace.h TRACE_INCLUDE_PATH fixed -> drivers/devfreq/sprd')
          else:
              print('sprd_dfs_trace.h already OK')
          # companion fix (test branch has it, android-9.0 branch lacks it):
          # without -I$(srctree) the <drivers/devfreq/sprd/...> lookup has no search path
          m = 'drivers/devfreq/sprd/Makefile'
          s = open(m).read()
          if 'ccflags-y' not in s:
              open(m, 'a').write('ccflags-y += -I$(srctree)\n')
              print('sprd Makefile: ccflags-y += -I$(srctree) appended')
          else:
              print('sprd Makefile ccflags already present')
          PYEOF

      - name: Fix sprdwcn duplicate enums (gcc8+ redeclaration is error, test branch rebuilt files but we keep a9.0 behavior)
        run: |
          cd source
          python3 << 'PYEOF'
          import re
          # 1) include/misc/marlin_platform.h: drop duplicate enum marlin_sub_sys
          #    (wcn_bus.h already defines the same members as enum wcn_sub_sys),
          #    then bridge the old type name via macro so .c files need no edits.
          p = 'include/misc/marlin_platform.h'
          s = open(p).read()
          if 'enum marlin_sub_sys' in s:
              s2 = re.sub(r'enum marlin_sub_sys\s*\{[^}]*\};\n?', '', s, count=1)
              anchor = '#include <linux/types.h>'
              if anchor in s2:
                  s2 = s2.replace(anchor, anchor +
                      '\n#include <misc/wcn_bus.h>\n'
                      '/* gcc8+: enum member names MARLIN_* already declared in wcn_bus.h;\n'
                      ' * keep the old type tag alive for .c files via macro bridge */\n'
                      '#ifndef marlin_sub_sys\n'
                      '#define marlin_sub_sys wcn_sub_sys\n'
                      '#endif', 1)
              open(p, 'w').write(s2)
              print('marlin_platform.h: duplicate enum removed + wcn_bus.h include + macro bridge')
          else:
              print('marlin_platform.h: already clean')
          # 2) drivers/misc/sprdwcn/sleep/slp_mgr.h: drop duplicate enum slp_subsys
          p = 'drivers/misc/sprdwcn/sleep/slp_mgr.h'
          s = open(p).read()
          if 'enum slp_subsys {' in s:
              s2 = re.sub(r'enum slp_subsys\s*\{[^}]*\};\n?', '', s, count=1)
              anchor = '#include <misc/marlin_platform.h>'
              if anchor in s2 and '#include <misc/wcn_bus.h>' not in s2:
                  s2 = s2.replace(anchor, anchor + '\n#include <misc/wcn_bus.h>', 1)
              open(p, 'w').write(s2)
              print('slp_mgr.h: duplicate enum slp_subsys removed')
          else:
              print('slp_mgr.h: already clean')
          PYEOF

      - name: Accept inlinecrypt mount option (A11 fstab compat)
        run: |
          cd source
          python3 << 'PYEOF'
          import sys
          def patch(path, anchor, tag):
              s = open(path).read()
              n = s.count(anchor)
              if n != 1:
                  print('%s: anchor matched %d times, abort' % (tag, n)); sys.exit(1)
              ins = ('\t\t/* Accept inlinecrypt (A11 fstab compat): '
                     'software fscrypt fallback */\n'
                     '\t\tif (!strcmp(p, "inlinecrypt"))\n'
                     '\t\t\tcontinue;\n')
              open(path, 'w').write(s.replace(anchor, ins + anchor))
              print('%s patched' % tag)
          patch('fs/f2fs/super.c',
                '\t\targs[0].to = args[0].from = NULL;\n'
                '\t\ttoken = match_token(p, f2fs_tokens, args);',
                'f2fs')
          patch('fs/ext4/super.c',
                '\t\targs[0].to = args[0].from = NULL;\n'
                '\t\ttoken = match_token(p, tokens, args);\n'
                '\t\tif (handle_mount_opt(sb, p, token, args, journal_devnum,',
                'ext4')
          PYEOF

      - name: Overlay r37 core (module.c force-load + fgu present fix + eta6947 charger)
        run: |
          tar -xzf r37_overlay.tar.gz -C source
          cd source
          python3 port_r37.py .

      - name: Overlay as1509 crown driver (factory-spec rewrite)
        run: |
          tar -xzf as1509_overlay.tar.gz -C source
          cd source
          python3 port_as1509.py .
          echo "=== as1509 verify ==="
          grep -n "as,as1509_i2c" drivers/input/misc/as1509_i2c.c

      - name: Overlay qmc6308 mag + mir3da gsensor (CD12X BOM vs CD20MAX diff)
        run: |
          tar -xzf drivers_overlay.tar.gz -C source
          cd source
          python3 port_drivers.py .
          grep -n "qmc,qmc6308\|da,da217" drivers/input/misc/qmc6308/qmc6308.c drivers/input/misc/mir3da/mir3da_cust.c

      - name: Apply factory config + r37 additions, olddefconfig
        run: |
          cd source
          sed -i 's/^EXTRAVERSION =.*/EXTRAVERSION =/' Makefile
          cp ../factory98.config .config
          cat >> .config << 'EOF'
          CONFIG_TOUCHSCREEN_HYNITRON_TS=y
          CONFIG_CHARGER_ETA6947=y
          CONFIG_INPUT_AS1509=y
          CONFIG_SENSORS_QMC6308=y
          CONFIG_INPUT_MIR3DA=y
          EOF
          sed -i 's/^          //' .config.tmp 2>/dev/null || true
          python3 - << 'PYEOF'
          # 去掉 heredoc 缩进残留（上面 cat >> 的行带 10 空格前缀会破坏 config 语法）
          lines = open('.config', encoding='utf-8', errors='replace').read().splitlines()
          out = []
          for l in lines:
              if l.startswith('          CONFIG_') or l.strip().startswith('CONFIG_') and l != l.lstrip():
                  out.append(l.strip())
              else:
                  out.append(l)
          open('.config', 'w', encoding='utf-8').write('\n'.join(out) + '\n')
          print('config indent cleaned')
          PYEOF
          grep -E "HYNITRON_TS|ETA6947|AS1509|QMC6308|MIR3DA" .config | head -8
          sed -i '/yamltree\.o/d' scripts/dtc/Makefile
          sed -i 's/dt_to_yaml(/\/\/ dt_to_yaml(/g' scripts/dtc/dtc.c
          sed -i '/ifdef CONFIG_CC_STACKPROTECTOR_STRONG/{n;s/stackp-flag :=.*/stackp-flag := -fstack-protector-strong/}' Makefile
          sed -i '/ifdef stackp-name/,/endif/{s/exit 1/true/}' Makefile
          sed -i '/ifdef stackp-check/,/endif/{s/exit 1/true/}' Makefile
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          make olddefconfig
          cp .config ../final_config.txt
          echo "=== key config after olddefconfig ==="
          grep -E "CONFIG_TOUCHSCREEN_HYNITRON_TS|CONFIG_CHARGER_ETA6947|CONFIG_INPUT_AS1509|CONFIG_SENSORS_QMC6308|CONFIG_INPUT_MIR3DA|CONFIG_MODVERSIONS|CONFIG_SPRD_POWER" ../final_config.txt

      - name: Pre-build single-file V=1 diagnostic (sdiohal_main.c incomplete type mystery)
        run: |
          cd source
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          echo "=== md5 baseline check (wcn_bus.h expect def4a85269a6dfbdd8520d9189f49bb6) ==="
          md5sum include/misc/wcn_bus.h drivers/misc/sprdwcn/sleep/slp_mgr.h include/misc/marlin_platform.h
          echo "=== wcn_bus.h 55-75 (struct sdio_puh_t must be here) ==="
          sed -n '55,75p' include/misc/wcn_bus.h
          echo "=== marlin_platform.h 20-36 (fix6 insert effect) ==="
          sed -n '20,36p' include/misc/marlin_platform.h
          echo "=== single-file V=1 build (full gcc cmdline + errors, fast) ==="
          make drivers/misc/sprdwcn/sdio/sdiohal_main.o V=1 2>&1 | tail -50 || true

      - name: Build kernel + modules
        run: |
          cd source
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          KCFLAGS="-Wno-error=sizeof-pointer-memaccess -Wno-error=array-bounds -Wno-error=missing-braces -Wno-error=format -Wno-error=missing-attributes -Wno-error=address-of-packed-member -Wno-address-of-packed-member -Wno-error=zero-length-bounds -Wno-restrict -fno-tree-loop-distribute-patterns -fno-store-merging -fno-tree-slp-vectorize"
          set -o pipefail
          make -j$(nproc) Image KCFLAGS="$KCFLAGS" 2>&1 | tee build.log || {
            echo "=== BUILD FAILED, extracting errors ==="
            grep -nE "error:|Error [0-9]" build.log | head -50
            grep -nE "error:|Error [0-9]" build.log | head -50 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
          echo "=== Image build OK ==="
          make modules KCFLAGS="$KCFLAGS" 2>&1 | tee -a build.log || {
            echo "=== MODULES FAILED, extracting errors ==="
            grep -nE "error:|Error [0-9]" build.log | head -50
            grep -nE "error:|Error [0-9]" build.log | head -50 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
          echo "=== modules build OK ==="

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-37
          path: |
            source/build.log
            source/include/config/kernel.release
            final_config.txt
          if-no-files-found: ignore

      - name: Package modules
        run: |
          cd source
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          make modules_install INSTALL_MOD_PATH=./modules_out
          tar -czf ../modules37.tar.gz -C modules_out/lib/modules .

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build37-${{ github.run_id }}
          name: W527 r37 factory-replica build ${{ github.run_id }}
          files: |
            source/arch/arm64/boot/Image
            source/Module.symvers
            modules37.tar.gz
            source/System.map
            source/build.log
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
