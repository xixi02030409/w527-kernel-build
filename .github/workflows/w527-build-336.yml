name: W527 kernel build 4.14.336

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout this repo (workflow + config + merge patch)
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev make gcc libyaml-dev cpio xz-utils

      - name: Clone upstream kernel source (ZeroDreamCat uws6152 4.14.98)
        run: |
          git clone --depth=1 --branch test --recurse-submodules \
            https://github.com/ZeroDreamCat/android_uws6152_4.14.98.git source
          cd source
          git submodule update --init --recursive || true

      - name: Apply 4.14.336 merge patch (stable backport + W527 conflict resolutions)
        run: |
          cd source
          git apply --check --whitespace=nowarn ../w527_336.patch
          git apply --whitespace=nowarn ../w527_336.patch
          echo "=== Makefile after patch ==="
          grep -E "^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)" Makefile
          echo "=== spot checks ==="
          grep -c "sprd_update_cpu_usage" arch/arm64/kernel/process.c
          grep -c "check_panic_on_warn" kernel/panic.c
          grep -c "GPIO_PMIC_EIC_SPRD" drivers/gpio/Kconfig

      - name: Setup GCC 4.9 aarch64 toolchain
        run: |
          mkdir -p $HOME/toolchains && cd $HOME/toolchains
          git clone --depth=1 --branch=W20.13.3 \
            --filter=blob:none --no-checkout \
            https://github.com/deadman96385/jingpad_android_bsp.git toolchain-tmp
          cd toolchain-tmp
          git sparse-checkout init --cone
          git sparse-checkout set toolchain/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9
          git checkout
          mv toolchain/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
             ../aarch64-linux-android-4.9
          cd ..
          rm -rf toolchain-tmp
          chmod -R a+x $HOME/toolchains/aarch64-linux-android-4.9/bin
          echo "$HOME/toolchains/aarch64-linux-android-4.9/bin" >> $GITHUB_PATH

      - name: Verify toolchain
        run: |
          aarch64-linux-android-gcc --version

      - name: Overlay fscrypt v2 backport + migrated fs glue (A11 vold requires v2 API)
        run: |
          tar -xzf overlay_fscrypt_v2.tar.gz -C source
          cd source
          rm -f include/linux/fscrypt_notsupp.h include/linux/fscrypt_supp.h
          echo "=== fs/crypto files ==="; ls fs/crypto/
          echo "=== v1 page-API remnants (expect clean) ==="
          grep -rln "fscrypt_encrypt_page(\|fscrypt_decrypt_page(\|fscrypt_pullback_bio_page\|fscrypt_restore_control_page\|fscrypt_control_page\|fscrypt_decrypt_bio_pages" fs/ || echo "clean"

      - name: Accept inlinecrypt mount option (A11 fstab needs it; software fscrypt fallback)
        run: |
          cd source
          python3 << 'PYEOF'
          import sys
          def patch(path, anchor, tag):
              s = open(path).read()
              n = s.count(anchor)
              if n != 1:
                  print('%s: anchor matched %d times, abort' % (tag, n)); sys.exit(1)
              ins = ('\t\t/* Accept inlinecrypt (A11 fstab compat): '
                     'software fscrypt fallback */\n'
                     '\t\tif (!strcmp(p, "inlinecrypt"))\n'
                     '\t\t\tcontinue;\n')
              open(path, 'w').write(s.replace(anchor, ins + anchor))
              print('%s patched: inlinecrypt accepted+ignored' % tag)
          patch('fs/f2fs/super.c',
                '\t\targs[0].to = args[0].from = NULL;\n'
                '\t\ttoken = match_token(p, f2fs_tokens, args);',
                'f2fs')
          patch('fs/ext4/super.c',
                '\t\targs[0].to = args[0].from = NULL;\n'
                '\t\ttoken = match_token(p, tokens, args);\n'
                '\t\tif (handle_mount_opt(sb, p, token, args, journal_devnum,',
                'ext4')
          PYEOF

      - name: Overlay W527 BSP drivers (qmc6308 mag + mir3da gsensor)
        run: |
          tar -xzf drivers_overlay.tar.gz -C source
          cd source
          python3 port_drivers.py .
          grep -n "qmc,qmc6308\|da,da217" drivers/input/misc/qmc6308/qmc6308.c drivers/input/misc/mir3da/mir3da_cust.c

      - name: Overlay run#26 (map_user + systimer + gnss compatible fix + marlin_shutdown guard)
        run: |
          tar -xzf drivers_overlay_run26.tar.gz -C source
          cd source
          python3 << 'PYEOF'
          import sys
          def replace(path, old, new, tag):
              s = open(path).read()
              n = s.count(old)
              if n != 1:
                  print('%s: anchor matched %d times, abort' % (tag, n)); sys.exit(1)
              open(path, 'w').write(s.replace(old, new))
              print('%s patched' % tag)
          def insert_after(path, anchor, ins, tag):
              s = open(path).read()
              n = s.count(anchor)
              if n != 1:
                  print('%s: anchor matched %d times, abort' % (tag, n)); sys.exit(1)
              open(path, 'w').write(s.replace(anchor, anchor + ins))
              print('%s patched' % tag)
          def append(path, text, tag):
              s = open(path).read()
              key = text.strip().splitlines()[0]
              if key in s:
                  print('%s already present' % tag); return
              if not s.endswith('\n'):
                  s += '\n'
              open(path, 'a').write(text + '\n')
              print('%s appended' % tag)

          replace('drivers/misc/sprdwcn/platform/gnss/gnss_common_ctl.c',
                  '{.compatible = "sprd,gnss_common_ctl", .data = (void *)&gnssver},',
                  '{.compatible = "sprd,gnss-common-ctl", .data = (void *)&gnssver},',
                  'gnss-compatible')

          insert_after('drivers/misc/sprdwcn/platform/wcn_boot.c',
                       'static void marlin_shutdown(struct platform_device *pdev)\n{\n',
                       '\tif (!marlin_dev)\n\t\treturn;\n',
                       'marlin_shutdown-guard')

          append('drivers/misc/Makefile', 'obj-y\t\t\t\t+= sprd_map/', 'sprd_map-mount')

          append('drivers/soc/sprd/Kconfig',
                 'config SPRD_SYSTIMER\n\tbool "Unisoc systimer/sysfrt boottime accounting"\n\tdefault y\n',
                 'systimer-kconfig')
          append('drivers/soc/sprd/Makefile',
                 'obj-$(CONFIG_SPRD_SYSTIMER)\t+= sprd_systimer.o',
                 'systimer-mount')
          PYEOF
          echo "=== verify ==="
          grep -n "sprd,gnss-common-ctl" drivers/misc/sprdwcn/platform/gnss/gnss_common_ctl.c
          grep -n "sprd_map/" drivers/misc/Makefile
          grep -n "SPRD_SYSTIMER" drivers/soc/sprd/Makefile drivers/soc/sprd/Kconfig

      - name: Overlay run#33 (factory old-SDK hynitron FULL port)
        run: |
          rm -rf source/drivers/input/touchscreen/hynitron
          tar -xzf drivers_overlay_run27.tar.gz -C source
          sed -i 's/^CONFIG_TOUCHSCREEN_HYNITRON_TS=.*/CONFIG_TOUCHSCREEN_HYNITRON_TS=y/' w527.config
          sed -i 's/^CONFIG_TOUCHSCREEN_CST9217=.*/CONFIG_TOUCHSCREEN_CST9217=n/' w527.config
          grep -q '^CONFIG_TOUCHSCREEN_HYNITRON_TS=y' w527.config || printf 'CONFIG_TOUCHSCREEN_HYNITRON_TS=y\n' >> w527.config
          grep -q '^CONFIG_TOUCHSCREEN_CST9217=n' w527.config || printf 'CONFIG_TOUCHSCREEN_CST9217=n\n' >> w527.config
          sed -i '/HIGH_SPEED_IIC_TRANSFER/d' source/drivers/input/touchscreen/hynitron/Makefile
          sed -i 's/msg\.flags |= I2C_M_RD;/msg.flags = I2C_M_RD;/' source/drivers/input/touchscreen/hynitron/hynitron_i2c.c
          sed -i 's/msgs\[1\]\.flags |= I2C_M_RD;/msgs[1].flags = I2C_M_RD;/' source/drivers/input/touchscreen/hynitron/hynitron_i2c.c
          echo "=== config verify ==="
          grep -n "TOUCHSCREEN_HYNITRON_TS\|TOUCHSCREEN_CST9217" w527.config
          find source/drivers/input/touchscreen/hynitron -type f | wc -l

      - name: Apply W527 real device config and vermagic alignment
        run: |
          cd source
          sed -i 's/^EXTRAVERSION =.*/EXTRAVERSION =/' Makefile
          grep '^EXTRAVERSION' Makefile || echo "EXTRAVERSION cleared"
          python3 << 'PYEOF'
          import re
          p = 'include/linux/fs.h'
          s = open(p).read()
          if 's_master_keys' not in s:
              s2, n1 = re.subn(
                  r'(const struct fscrypt_operations\s+\*s_cop;)',
                  r'\1\n#ifdef CONFIG_FS_ENCRYPTION\n\tstruct key\t*s_master_keys;\n#endif',
                  s, count=1)
              s2, n2 = re.subn(
                  r'(struct fscrypt_operations;)',
                  r'\1\nstruct key;',
                  s2, count=1)
              if n1 != 1 or n2 != 1:
                  raise SystemExit('fs.h patch anchors not found: n1=%d n2=%d' % (n1, n2))
              open(p, 'w').write(s2)
              print('fs.h patched: s_master_keys (struct key*) added')
          else:
              print('fs.h already patched')
          PYEOF
          cp ../w527.config .config
          sed -i '/yamltree\.o/d' scripts/dtc/Makefile
          sed -i 's/dt_to_yaml(/\/\/ dt_to_yaml(/g' scripts/dtc/dtc.c
          sed -i '/ifdef CONFIG_CC_STACKPROTECTOR_STRONG/{n;s/stackp-flag :=.*/stackp-flag := -fstack-protector-strong/}' Makefile
          sed -i '/ifdef stackp-name/,/endif/{s/exit 1/true/}' Makefile
          sed -i '/ifdef stackp-check/,/endif/{s/exit 1/true/}' Makefile
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-android-
          make olddefconfig
          cp .config ../final_config.txt

      - name: Build kernel + modules
        run: |
          cd source
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-android-
          KCFLAGS="-Wno-error=sizeof-pointer-memaccess -Wno-error=array-bounds -Wno-error=missing-braces -Wno-error=format"
          set -o pipefail
          make -j$(nproc) Image KCFLAGS="$KCFLAGS" 2>&1 | tee build.log || {
            echo "=== BUILD FAILED, extracting errors ==="
            grep -nE "error:|Error [0-9]" build.log | head -50
            grep -nE "error:|Error [0-9]" build.log | head -50 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
          echo "=== Image build OK ==="
          make modules 2>&1 | tee -a build.log

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-336
          path: |
            source/build.log
            source/include/config/kernel.release
            final_config.txt
          if-no-files-found: ignore

      - name: Verify kernel image (diagnostic, non-fatal)
        run: |
          cd source
          ls -la arch/arm64/boot/ || true
          if [ -f arch/arm64/boot/Image ]; then
            od -A x -t x1 -N 8 arch/arm64/boot/Image
          else
            echo "WARN: arch/arm64/boot/Image NOT found"
          fi
          KR=$(make -s kernelrelease 2>/dev/null | grep -v '^#' | tail -1)
          echo "kernelrelease: $KR"

      - name: Package modules
        run: |
          cd source
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-android-
          make modules_install INSTALL_MOD_PATH=./modules_out
          tar -czf ../modules336.tar.gz -C modules_out/lib/modules .

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build336-${{ github.run_id }}
          name: W527 4.14.336 build ${{ github.run_id }}
          files: |
            source/arch/arm64/boot/Image
            modules336.tar.gz
            source/System.map
            source/build.log
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
