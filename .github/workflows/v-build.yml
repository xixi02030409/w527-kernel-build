name: V-line build (mainline unisoc, dual track)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'v-max = v7.2-rc6-ums9230-0 (codeberg) | v-lts = v6.12 tag'
        required: true
        default: 'v-max'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Pick tree ref
        id: ref
        run: |
          if [ "${{ inputs.variant }}" = "v-lts" ]; then
            echo "repo=https://github.com/sprd-linux/ums9230-mainline-linux.git" >> $GITHUB_OUTPUT
            echo "ref=v6.12" >> $GITHUB_OUTPUT
          else
            echo "repo=https://codeberg.org/ums9230-mainline/linux.git" >> $GITHUB_OUTPUT
            echo "ref=v7.2-rc6-ums9230-0" >> $GITHUB_OUTPUT
          fi

      - name: Clone unisoc mainline tree
        run: |
          git clone --depth 1 --branch ${{ steps.ref.outputs.ref }} ${{ steps.ref.outputs.repo }} src
          cd src && git log --oneline -3 && head -5 Makefile

      - name: Fetch pmOS config
        run: |
          curl -sL "https://raw.githubusercontent.com/xixi02030409/w527-kernel-build/main/configs/ums9230-pmos.config" -o src/pmos.config
          head -3 src/pmos.config

      - name: Install clang toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev cpio xz-utils \
            clang llvm lld pahole zstd
          clang --version | head -1

      - name: Configure (pmOS config + olddefconfig)
        run: |
          cd src
          cp pmos.config .config
          make ARCH=arm64 LLVM=1 olddefconfig
          grep -E "CONFIG_ARCH_SPRD|CONFIG_EFI_ZBOOT" .config || true

      - name: Build Image + dtbs
        run: |
          cd src
          set -o pipefail
          make ARCH=arm64 LLVM=1 -j$(nproc) Image dtbs 2>&1 | tee build.log
          ls -l arch/arm64/boot/Image
          ls arch/arm64/boot/dts/sprd/*.dtb 2>/dev/null | head -8 || true

      - name: Post-build audit
        run: |
          cd src
          python3 - << 'PY'
          import struct
          d = open('arch/arm64/boot/Image','rb').read()
          print("Image size:", len(d))
          br = struct.unpack('<I', d[:4])[0] >> 24
          print("arm64 branch opcode:", hex(br))
          assert br == 0x14, "not an arm64 Image"
          print("OK: raw arm64 Image")
          PY

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vline-${{ inputs.variant }}
          path: |
            src/arch/arm64/boot/Image
            src/build.log
          if-no-files-found: ignore

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: vline-${{ inputs.variant }}-${{ github.run_id }}
          files: |
            src/arch/arm64/boot/Image
            src/build.log
